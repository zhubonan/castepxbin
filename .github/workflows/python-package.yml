# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pymatgen no longer supports 3.9
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymatgen
        pip install .[test]
    - name: Report resolved versions
      run: python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"
    - name: Test with pytest
      run: |
        pytest

# Test without pymatgen as dependency
  test_no_pmg:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]
    - name: Report resolved versions
      run: python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"
    - name: Test with pytest
      run: |
        pytest

# The package advertises numpy>=1.22,<3 - make sure the 1.x half is actually tested
  test_numpy1:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies with numpy pinned below 2
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2" .[test]
    - name: Check numpy really is 1.x
      run: |
        python -c "import numpy, scipy; print('numpy', numpy.__version__, '| scipy', scipy.__version__)"
        python -c "import numpy, sys; sys.exit(0 if numpy.__version__.startswith('1.') else 'expected numpy 1.x')"
    - name: Test with pytest
      run: |
        pytest
